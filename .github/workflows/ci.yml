name: CI

# Checks for the engine (`core`), its shared packages (`i18n`, `fonts`), and the adapters.
# One job runs the source checks and the build. A second job runs the unit tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default GITHUB_TOKEN: lint/test/build only read the repo.
permissions:
  contents: read

# New commits supersede older verification runs for the same PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh
      - name: Lint
        run: bun run lint
      - name: Lane boundary compile check
        run: bun run check:lane-boundaries
      - name: tsconfig lib floor check
        run: bun run check:tsconfig-lib-floor
      - name: Format check
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: i18n locale sync check
        run: bun run i18n:validate
      - name: Build packages
        run: bun run build:packages
      - name: Shipped text-shaper check
        run: bun run check:shipped-shaper
      - name: Compiled core stylesheet check
        run: bun run check:core-css-compiled
      - name: API report check
        run: bun run api:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh
      - name: Unit tests
        run: bun run test

  angular:
    name: Angular example in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh
      - name: Build packages
        run: bun run build:packages
      - name: Build the example
        run: bun run --filter './examples/angular' build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run test:e2e:angular
