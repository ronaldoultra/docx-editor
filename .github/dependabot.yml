# Supply-chain defense: 7-day cooldown before Dependabot opens an update PR.
# Compromised packages (stolen maintainer tokens) are almost always yanked
# within hours, well before this window elapses.
#
# One package stream, one grouped PR per week. It uses the `bun` ecosystem because
# the root lockfile is `bun.lock`; the `npm` ecosystem cannot update it. `/` covers
# every workspace member, so a per-package entry would open a second PR for the
# same bump.
#
# Majors stay ungrouped on purpose: they are real upgrade work and need to be
# revertable on their own. Fold them in by adding 'major' to `update-types`.
#
# `typescript` stays on 6: tsup, rollup-plugin-dts, and the framework
# examples load it as a library, and TypeScript 7 has no library API. The compiler is
# TypeScript 7, installed as `typescript7`. Lift the ignore once those tools support 7.
#
# `tailwindcss` stays on 3: the core dist stylesheet and most examples use a v3
# config, and v4 needs a config migration, not a version bump.
#
# Dependabot v2 rejects YAML aliases (dependabot-core#1582), so the cooldown
# and group blocks are spelled out per entry.
version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    exclude-paths:
      - 'examples/**'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      library:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
